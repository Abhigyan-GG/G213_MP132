on: [push]
name: MP132 service tests
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: docker build -t mp132-api:1.0 .
      - name: Check the container health endpoint
        run: |
          docker run -d --name mp132 -p 8000:8000 mp132-api:1.0
          curl --retry 15 --retry-all-errors --retry-delay 2 --fail http://localhost:8000/health
